name: Continuous Integration & Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite & Health Probes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx ruff

      - name: Code Quality & Linting
        run: |
          ruff check backend/app

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./stadium360_test.db
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_competition_2026
        run: |
          pytest backend/tests -v --durations=10

  frontend-build:
    name: Frontend Build & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Type Check & Production Vite Build
        working-directory: frontend
        run: npm run build

  docker-compose-validation:
    name: Docker Containerization Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

