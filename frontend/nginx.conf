# ==============================================================================
# Airtel Stadium360 — Production Nginx Configuration
# High-concurrency reverse proxy, asset caching, compression, and security headers
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Maximum client upload payload (for document exports & telecom traces)
    client_max_body_size 25M;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Enterprise HTTP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Root static asset directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Single Page Application (SPA) HTML5 History Mode Routing
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching index.html to guarantee instantaneous atomic deployments
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Immutable Cache for Content-Hashed Vite Chunks & Static Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Nginx Container Healthcheck Probe
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Reverse Proxy to Airtel Stadium360 FastAPI Backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # WebSocket & Long-Polling Protocol Upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Request Header Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts tuned for complex MILP optimizations and PDF report rendering
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Proxy Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
